name: Build Flutter APK & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK platform 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" || true

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run unit & widget tests
        run: flutter test test/widget_test.dart test/echo_services_test.dart

      - name: Build APK Release
        run: flutter build apk --release

      - name: Prepare release assets
        run: |
          mkdir -p releases
          cp build/app/outputs/flutter-apk/app-release.apk releases/omni-player-release.apk
          cp build/app/outputs/flutter-apk/app-release.apk releases/omni-player-arm64-v8a.apk 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: omni-player-release-apk
          path: build/app/outputs/flutter-apk/*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.0' }}
          name: "Omni Player v1.0.0 • Production Release"
          body: |
            ### 🎵 Omni Player v1.0.0 Direct Download
            
            Download and install the APK directly on your Android phone:
            
            - **Universal Release** (~12MB): [omni-player-release.apk](https://github.com/Roshangamerz/Omni-player/releases/download/v1.0.0/omni-player-release.apk)
            - **Modern 64-bit ARM** (~3.9MB): [omni-player-arm64-v8a.apk](https://github.com/Roshangamerz/Omni-player/releases/download/v1.0.0/omni-player-arm64-v8a.apk)
            
            #### Highlights
            - YouTube Music InnerTube feed & Apple Music top charts
            - 9-Provider millisecond word-by-word synchronized lyrics
            - Canvas video looping artwork player
            - ShazamKit acoustic recognition
            - Hardware AudioFX Graphic Equalizer with AutoEq presets
            - Material 3 Expressive & Apple-inspired dual player UI
          files: |
            releases/omni-player-release.apk
            releases/omni-player-arm64-v8a.apk
